<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
</head>
<body>
<h2>결제 성공</h2>
<p id="paymentKey"></p>
<p id="orderId"></p>
<p id="amount"></p>

<script>
  const urlParams = new URLSearchParams(window.location.search);
  const paymentKey = urlParams.get("paymentKey");
  const orderId = urlParams.get("orderId");
  const amount = urlParams.get("amount");

  async function confirm() {
    // 1. DTO 구조에 맞춰 데이터 준비
    const requestData = {
      paymentKey: paymentKey,
      orderId: orderId,
      amount: Long.parseLong(amount), // 숫자로 처리되는지 확인 필요
    };

    // 2. 서버의 API 경로와 JWT 토큰 추가
    const response = await fetch("/api/v1/payments/confirm", { // 경로 확인!
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        // JWT 토큰이 로컬 스토리지에 있다면 포함시켜야 합니다.
        "Authorization": "Bearer " + localStorage.getItem("token")
      },
      body: JSON.stringify(requestData),
    });

    const json = await response.json();

    if (response.ok) {
      // 결제 성공 시 로직 (예: 완료 페이지로 이동 또는 알림)
      alert("결제가 성공적으로 완료되었습니다.");
      console.log("승인 결과:", json);
      // window.location.href = "/orders/complete";
    } else {
      // 결제 실패 시 (금액 불일치, 토스 승인 거절 등)
      alert("결제 승인에 실패했습니다: " + json.message);
      window.location.href = `/fail.html?message=${json.message}&code=${json.code}`;
    }
  }

  if (paymentKey && orderId && amount) {
    confirm();
  } else {
    alert("유효하지 않은 결제 정보입니다.");
  }

  // 화면 표시용
  document.getElementById("orderId").textContent = "주문번호: " + orderId;
  document.getElementById("amount").textContent = "결제 금액: " + amount + "원";
  document.getElementById("paymentKey").textContent = "결제 키: " + paymentKey;
</script>
</body>
</html>
