<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>채팅 테스트 로그인</title>
    <style>
        body { font-family: sans-serif; padding: 20px; }
        .container { max-width: 400px; margin: auto; }
        input { width: 100%; padding: 8px; margin-bottom: 10px; box-sizing: border-box; }
        button { width: 100%; padding: 10px; background-color: #007bff; color: white; border: none; cursor: pointer; }
        #result { margin-top: 20px; padding: 10px; background-color: #f0f0f0; word-wrap: break-word; }
        h2 { text-align: center; }
    </style>
</head>
<body>

<div class="container">
    <h2>채팅 테스트 로그인</h2>
    <form id="loginForm">
        <input type="text" id="username" placeholder="아이디" required>
        <input type="password" id="password" placeholder="비밀번호" required>
        <button type="submit">로그인</button>
    </form>

    <div id="result">
        <p><strong>상태:</strong> <span id="statusSpan">대기 중...</span></p>
    </div>
</div>

<script>
    document.getElementById('loginForm').addEventListener('submit', async function(event) {
        event.preventDefault(); // 폼 기본 제출 동작 방지

        const username = document.getElementById('username').value;
        const password = document.getElementById('password').value;
        const statusSpan = document.getElementById('statusSpan');

        statusSpan.textContent = '로그인 중...';

        try {
            const response = await fetch('/api/users/login', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({ username: username, password: password })
            });

            if (!response.ok) {
                const errorData = await response.json();
                throw new Error(errorData.message || '로그인에 실패했습니다.');
            }

            // 1. 헤더에서 Access Token 추출
            const authorizationHeader = response.headers.get('Authorization');
            let accessToken = '';

            if (authorizationHeader && authorizationHeader.startsWith('Bearer ')) {
                accessToken = authorizationHeader.substring(7);
            } else {
                 throw new Error('헤더에서 Access Token을 찾을 수 없습니다.');
            }

            // 2. localStorage에 토큰 저장
            localStorage.setItem('accessToken', accessToken);

            // (선택) Refresh Token도 저장하고 싶다면:
            const responseData = await response.json();
            if (responseData.result && responseData.result.refreshToken) {
                localStorage.setItem('refreshToken', responseData.result.refreshToken);
            }

            statusSpan.textContent = '로그인 성공! 채팅방으로 이동합니다...';

            // 3. 채팅 페이지로 이동
            setTimeout(() => {
                window.location.href = 'chat.html';
            }, 1000); // 1초 뒤 이동

        } catch (error) {
            statusSpan.textContent = `에러: ${error.message}`;
        }
    });
</script>

</body>
</html>
