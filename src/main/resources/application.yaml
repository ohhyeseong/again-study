server:
  port: 8081

spring:
  application:
    name: demo

    datasource:
      p6spy:
        enable-logging: true
        logging: slf4j
        multiline: true

  datasource:
    url: jdbc:mysql://localhost:3306/demo
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: root
    password: 1234

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        default_batch_fetch_size: 100
        show_sql: true
        format_sql: false
        highlight_sql: true

security:
  jwt:
    token:
      # 임의의 문자열 (Base64로 인코딩된 값이면 좋지만, 그냥 긴 영어+숫자 조합도 됩니다)
      secret-key: "mySecretKeyIsVeryVeryLongAndSecureSoNoOneCanGuessIt"
      expire-length: 3600000 # 1시간 (밀리초)